{% extends "base.html" %} 
{% block title %}Create Account{% endblock title %}
{% block content %}
    <div class="flex flex-col justify-center lg:px-8">

        <h1 class="text-2xl/7 font-bold text-white text-center sm:truncate sm:text-3xl sm:tracking-tight">Welcome on Pack App</h1>

        <h2 class="mt-10 text-center text-2xl/9 font-bold tracking-tight text-white">Create Account</h2>

        <form method='post' class="my-form space-y-6 block text-sm/6 gap-7 font-medium text-gray-100 mt-10 sm:mx-auto sm:w-full sm:max-w-sm">
            {% csrf_token %}

           <div class="flex flex-col justify-center gap-6 w-full  rounded-md bg-white/5 px-5 py-2.5  font-bold bg-none">
                {{form.as_p}}
            </div>

            <button type='submit' class="flex w-full justify-center rounded-md bg-indigo-500 px-3 py-1.5 text-sm/6 font-semibold text-white hover:bg-indigo-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-500">Create Account</button>
        </form>
    </div>

    <style>
        .my-form input{
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 6px 12px;
            width: 100%;
            margin: 4px;
            border-radius: 12px;
        }
        .my-form label{
            display: block;
        }
    </style>
{% endblock content %}
