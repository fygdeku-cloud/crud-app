<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page non trouvée - 404</title>
    <!-- Intégration Tailwind CSS pour un rendu propre -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen p-4">
    <div class="text-center max-w-md">
        <h1 class="text-9xl font-extrabold text-sky-500 tracking-widest">404</h1>
        <div class="bg-sky-500 text-black px-2 text-sm rounded rotate-12 inline-block font-bold mb-6">
            Page Introuvable
        </div>
        <p class="text-slate-400 text-lg mb-8">
            Oups ! La page que vous recherchez semble avoir disparu ou l'adresse URL est incorrecte.
        </p>
        <a href="/" class="inline-block bg-sky-600 hover:bg-sky-500 text-white font-semibold px-6 py-3 rounded-lg shadow-lg transition duration-200">
            Retourner à l'accueil
        </a>
    </div>
</body>
</html>
